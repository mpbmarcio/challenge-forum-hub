name: Save GitHub Traffic Data

on:
  schedule:
    - cron: '0 0 * * 0'   # roda todo domingo à meia-noite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get clone traffic
        uses: octokit/request-action@v3.x
        id: clones
        with:
          route: GET /repos/${{ github.repository }}/traffic/clones
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Get view traffic
        uses: octokit/request-action@v3.x
        id: views
        with:
          route: GET /repos/${{ github.repository }}/traffic/views
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Save traffic data
        run: |
          FILE="traffic-$(date +'%Y-%m-%d').txt"
          echo "Date: $(date)" >> $FILE
          echo "Clones:" >> $FILE
          echo '${{ steps.clones.outputs.data }}' | jq . >> $FILE
          echo "Views:" >> $FILE
          echo '${{ steps.views.outputs.data }}' | jq . >> $FILE
          echo "" >> $FILE

      - name: Commit traffic log
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add traffic-*.txt
          git commit -m "Update traffic log for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git checkout -B traffic-data
          git push origin traffic-data
